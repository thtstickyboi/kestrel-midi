[package]
name = "kestrel"
version = "1.2.1"
edition = "2021"
rust-version = "1.88"
authors = ["thtstickyboi"]
description = "GPU-accelerated SoundFont/SFZ synthesizer for black MIDI"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/thtstickyboi/kestrel-midi"
keywords = ["midi", "synthesizer", "soundfont", "gpu", "wgpu"]
categories = ["multimedia::audio", "command-line-utilities", "rendering"]
# `/comments` is browsable in the repository and excluded from both the
# packaged crate and the generated source archives; see `.gitattributes`.
exclude = ["/out", "/comments"]

[lib]
name = "kestrel"
# rlib only. The cdylib was staging for a C ABI that is not implemented, and it
# collides with the bin target's output name.
crate-type = ["rlib"]

[features]
# Dev mode: the command line keeps the developer options -- engine tuning,
# switches back to old behaviour for comparison, diagnostics -- and the `null`
# and `gen-assets` commands. Off by default, which is the release build the
# downloadable zips are: `cargo build --release`. For dev mode,
# `cargo build --release --features dev`. Both render identically at the same
# settings.
default = []
dev = []

[[bin]]
name = "kestrel"
# A directory so the guided terminal UI can live beside the command line as
# modules of the binary, not of the library.
path = "src/bin/kestrel/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
# Local time for the timestamp the guided renderer puts on a file name that
# would otherwise overwrite something. `clock` only: no serde, no tz database.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# FLAC-compressed samples. The only decoder here that is not hand-written:
# see the note at the top of `src/wav.rs`.
claxon = "0.4"
clap = { version = "4", features = ["derive"] }
# Colour, cursor control and key events for the guided renderer.
crossterm = "0.29"
# Track names that are not UTF-8, such as Shift-JIS, which black MIDI is full
# of: shown in the guided renderer and put in a stem's file name.
encoding_rs = "0.8"
env_logger = "0.11"
# Free space on the drive a per-track render writes its stems to, checked
# before it starts. The only alternative is a raw system call.
fs4 = "0.13"
log = "0.4"
# Process resident memory for the progress screen, without `unsafe` here.
memory-stats = "1.2"
pollster = "0.4"
# Native file and folder pickers. On Linux the desktop portal is used rather
# than GTK, so building needs no system libraries.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The progress feed. `session`'s snapshots and events derive `Serialize`, so a
# Rust front end can serialise them however it likes, and `--progress json`
# writes them as JSON lines and reads control messages the same way.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Display width of a file name, which is not its length in chars: black MIDI
# titles are often Japanese, and a panel padded by char count breaks on them.
unicode-width = "0.2"
# `static-dxc` links Microsoft's DXC into the executable for the DX12 backend,
# on Windows x64 only; the build downloads its prebuilt library. wgpu's default,
# FXC, cannot compile these shaders.
wgpu = { version = "27", features = ["static-dxc"] }

# The VRAM fetcher, `src/gpu/vram.rs`: DXGI for an adapter's total memory and
# this process's budget, the performance counters for what every process on
# the adapter uses. The same crate and version wgpu already builds, and that
# module is its only user.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
